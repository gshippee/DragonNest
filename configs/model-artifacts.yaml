models:
  - model_id: qwen3-4b-genie
    model_version: qwen3-4b-w4a16-snapdragon-x-elite
    runtime: genie
    artifact_path: ${GENIE_DIR}
    checksum: ${QWEN3_4B_GENIE_SHA256_TREE}
    tokenizer_id: Qwen/Qwen3-4B
    precision: w4a16
    supported_accelerators: [htp]
    min_memory_mb: 4096
    max_context_tokens: 4096
    supports_steering: false
    supports_data_parallel: true
    supports_layer_pipeline: false
    runtime_options:
      backend: htp
      runtime_version: QAIRT-2.48
      executable: genie-t2t-run.exe
      config: genie_config.json
      timeout_sec: 180
      system_prompt: You are a helpful AI assistant.

  - model_id: qwen3-0.6b-part-a
    model_version: c1899de289a04d12100db370d81485cdf75e47ca
    runtime: qnn
    artifact_path: ${QWEN3_SPLIT_PART_A_QNN}
    checksum: ${QWEN3_SPLIT_PART_A_SHA256}
    tokenizer_id: Qwen/Qwen3-0.6B
    precision: fp16
    supported_accelerators: [htp]
    min_memory_mb: 1024
    max_context_tokens: 32
    supports_steering: false
    supports_data_parallel: false
    supports_layer_pipeline: true
    split_boundary:
      pipeline_id: qwen3-0.6b-split-14
      start_layer: 0
      end_layer: 14
      total_layers: 28
      input_tensor: input_ids
      output_tensor: hidden
      includes_embedding: true
      includes_lm_head: false
      boundary_format: raw-fp32
    runtime_options:
      artifact_kind: context_binary
      backend: htp
      runtime_version: QAIRT-2.48
      timeout_sec: 120
      outputs:
        - name: hidden
          shape: [1, 32, 1024]
          dtype: float32

  - model_id: qwen3-0.6b-part-b
    model_version: c1899de289a04d12100db370d81485cdf75e47ca
    runtime: qnn
    artifact_path: ${QWEN3_SPLIT_PART_B_QNN}
    checksum: ${QWEN3_SPLIT_PART_B_SHA256}
    tokenizer_id: Qwen/Qwen3-0.6B
    precision: fp16
    supported_accelerators: [htp]
    min_memory_mb: 1536
    max_context_tokens: 32
    supports_steering: false
    supports_data_parallel: false
    supports_layer_pipeline: true
    split_boundary:
      pipeline_id: qwen3-0.6b-split-14
      start_layer: 14
      end_layer: 28
      total_layers: 28
      input_tensor: hidden
      output_tensor: logits
      includes_embedding: false
      includes_lm_head: true
      boundary_format: raw-fp32
    runtime_options:
      artifact_kind: context_binary
      backend: htp
      runtime_version: QAIRT-2.48
      timeout_sec: 120
      outputs:
        - name: logits
          shape: [1, 32, 151936]
          dtype: float32
