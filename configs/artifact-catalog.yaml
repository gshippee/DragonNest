# Brain-side catalog of schedulable executable artifacts.
#
# Every entry the scheduler can route must appear here. Devices advertise
# which artifact IDs they hold (ModelCapability.model_id) and which are warm;
# the catalog supplies everything else. Memory/throughput values without a
# measured_* counterpart are conservative estimates and are surfaced as
# estimates in route explanations. Artifact binaries themselves never live in
# git; checksums reference externally downloaded bundles.
artifacts:
  # ---- Portable mock artifacts (run on any device, no Qualcomm SDKs) ----
  - artifact_id: small-chat-v1
    base_model_id: small-chat-v1
    base_model_family: mock
    model_version: mock-v1
    compatibility_classes: [mock]
    runtime: mock
    runtime_version: dragon-nest-0.1.0
    quantization: none
    max_context_tokens: 4096
    topology: full_model
    artifact_size_mb: 850
    estimated_memory_mb: 900
    measured_load_time_ms: 1500
    prefill_tokens_per_s: 350
    decode_tokens_per_s: 45
    kv_cache_bytes_per_token: 98304        # 96 KB/token estimate
    build_provenance: dragonnest mock fixture
    readiness: ready

